name: Update market data

on:
  workflow_dispatch:
    inputs:
      publish_destination:
        description: "Publish destination for Tableau exports (local or google-drive)"
        required: false
        default: local
  schedule:
    # 08:05 UTC = 17:05 JST; allow time for confirmed Japan-market EOD data
    - cron: '5 8 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      PUBLISH_DESTINATION: ${{ github.event.inputs.publish_destination || 'local' }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth

      - name: Test VOLBRK v2 scanner
        run: python tests/test_volbrk_v2.py

      - name: Update Nikkei 225 index
        run: python scripts/update_nikkei225_index.py --repo-root .

      - name: Update prices from fixed constituents CSV
        run: python scripts/update_nikkei225_prices.py --repo-root . --batch-size 75 --retries 2 --batch-sleep-seconds 1.0 --rate-limit-cooldown-seconds 30

      - name: Scan VOLBRK v2 across all 225 constituents
        id: volbrk_scan
        continue-on-error: true
        run: python scripts/scan_volbrk_v2.py --repo-root .

      - name: Show VOLBRK v2 result
        if: always()
        run: |
          if [ -f data/signals/volbrk_v2/latest.txt ]; then
            cat data/signals/volbrk_v2/latest.txt
          else
            echo "判定不能：全225銘柄の完全照合未完了"
          fi

      - name: Build Tableau exports locally
        if: ${{ !(((github.event_name == 'schedule') || env.PUBLISH_DESTINATION == 'google-drive') && env.GOOGLE_DRIVE_FOLDER_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 != '') }}
        run: python scripts/build_and_publish_tableau_feed.py --repo-root . --publish-destination local

      - name: Build Tableau exports and publish to Google Drive
        if: ${{ ((github.event_name == 'schedule') || env.PUBLISH_DESTINATION == 'google-drive') && env.GOOGLE_DRIVE_FOLDER_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 != '' }}
        run: python scripts/build_and_publish_tableau_feed.py --repo-root . --publish-destination google-drive

      - name: Commit and push if data changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update market data and VOLBRK v2 signals"
            git push
          fi

      - name: Fail if VOLBRK v2 scan was incomplete
        if: ${{ steps.volbrk_scan.outcome == 'failure' }}
        run: |
          echo "判定不能：全225銘柄の完全照合未完了"
          exit 1
